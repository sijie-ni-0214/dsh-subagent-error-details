name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The --config override bypasses pnpm 11's 24h minimumReleaseAge
      # gate: this repo tracks dsh prereleases (rc), which are by definition
      # freshly published when a dependabot PR lands, so a plain install
      # would be rejected for a day.
      - run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - run: pnpm build

      - run: pnpm test
